# ═══════════════════════════════════════════════════════════════════════════
#  nginx.conf — Proxy para AcademicFlow
#  Fix: resolver DNS interno de Docker, timeouts, CORS completo
# ═══════════════════════════════════════════════════════════════════════════

# Resolver DNS interno de Docker (necesario para proxy a contenedores por nombre)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    # ── Proxy a n8n (resuelve CORS: la web llama a /api/n8n/...) ──────────
    location /api/n8n/ {
        set $n8n_upstream http://n8n_academic:5678;
        proxy_pass         $n8n_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Headers CORS
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Max-Age'       3600;
            add_header 'Content-Length'               0;
            return 204;
        }
    }

    # ── SPA: todas las rutas sirven index.html ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Seguridad básica ───────────────────────────────────────────────────
    add_header X-Frame-Options   "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # ── Logs ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/academic_access.log;
    error_log  /var/log/nginx/academic_error.log warn;
}